<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>YOLO Live Recorder</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="btn-camera">카메라 켜기</button>
      <button id="btn-record" disabled>● 녹화</button>
      <button id="btn-split" disabled>화면 분할</button>
      <button id="btn-flip" disabled>전환</button>
      <button id="btn-detect" class="on">인식 ON</button>
      <label>
        되감기
        <select id="sel-buffer">
          <option value="1">1분</option>
          <option value="3">3분</option>
          <option value="5" selected>5분</option>
          <option value="10">10분</option>
        </select>
      </label>
      <label>
        녹화
        <select id="sel-source">
          <option value="raw">원본</option>
          <option value="boxes">박스 포함</option>
        </select>
      </label>
      <span id="status"></span>
    </header>

    <div id="studio-bar" class="link-bar" hidden>
      촬영 기기(iPhone)에서 <span id="studio-url"></span> 접속 → 코드 <b id="studio-code"></b>
      <span id="studio-state"></span>
    </div>

    <nav id="modes"></nav>

    <div id="save-bar" hidden>
      <span id="save-info"></span>
      <button id="btn-download">파일로 저장</button>
      <button id="btn-share">공유 / 사진에 저장</button>
      <button id="btn-discard">삭제</button>
    </div>

    <main id="panels">
      <section id="live-panel" class="panel">
        <video id="live" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
        <span class="badge live">LIVE</span>
        <span id="rec-time" class="badge rec" hidden></span>
      </section>

      <section id="timeshift-panel" class="panel" hidden>
        <div class="ts-videos">
          <video id="ts-a" class="active seg-only" muted playsinline></video>
          <video id="ts-b" class="seg-only" muted playsinline></video>
          <video id="ts-live" muted playsinline></video>
          <canvas id="ts-frames"></canvas>
          <span id="ts-label" class="badge">-00:00</span>
        </div>
        <div class="ts-controls">
          <select id="ts-delay">
            <option value="0">실시간</option>
            <option value="500">−0.5초</option>
            <option value="1000">−1초</option>
            <option value="2000">−2초</option>
            <option value="5000">−5초</option>
            <option value="10000">−10초</option>
            <option value="30000">−30초</option>
          </select>
          <button id="ts-back" class="seg-only">−10초</button>
          <button id="ts-play" class="seg-only">⏸</button>
          <button id="ts-fwd" class="seg-only">+10초</button>
          <input id="ts-seek" class="seg-only" type="range" min="0" max="0" step="0.1" value="0" />
          <button id="ts-mute" class="seg-only">🔇</button>
          <button id="ts-latest" class="seg-only">최신</button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
